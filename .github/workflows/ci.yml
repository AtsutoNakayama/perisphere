name: CI

# main を常にグリーンに保つための検証。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# シークレットは使わない（Fork からの PR でも動作させるため）。
permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 自分たちが書く Markdown のみ検証する。ベンダー管理の AI-DLC 文書（instructions/AIDLC.md
      # および .aidlc-rule-details/）は対象外。
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CLAUDE.md
            .github/**/*.md
            instructions/*.md
            !instructions/AIDLC.md

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 人間向けドキュメントのリンク切れを検出（相対リンク・外部リンク）。
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 README.md CONTRIBUTING.md
          fail: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test
      - run: pnpm audit --prod
